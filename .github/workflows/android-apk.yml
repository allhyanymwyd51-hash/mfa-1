name: Build native C++ MFA 1 APK

on:
  push:
    branches:
      - arena/d67d2c1c-mfa-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK, NDK and CMake
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build native C++ APK
        shell: bash
        run: |
          set +e
          (cd android && ./gradlew --no-daemon assembleDebug) > "$RUNNER_TEMP/native-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/native-build.log"
          if [ "$result" -ne 0 ]; then
            tail -n 45 "$RUNNER_TEMP/native-build.log" >> "$GITHUB_STEP_SUMMARY"
            detail=$(grep -E 'error:|fatal error:|CMake Error|ninja: error|FAILED:' "$RUNNER_TEMP/native-build.log" | tail -n 8 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            if [ -z "$detail" ]; then detail=$(tail -n 12 "$RUNNER_TEMP/native-build.log" | tr '\n' ' '); fi
            echo "::error title=Native APK build log::$detail"
            exit "$result"
          fi

      - name: Publish APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mfa-1-native-${GITHUB_SHA:0:7}"
          gh release create "$tag" android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MFA 1 — Native C++ Android" \
            --notes "Native C++ OpenGL ES build from ${GITHUB_REF_NAME} at ${GITHUB_SHA}; debug build for device testing."

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfa-1-native-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
